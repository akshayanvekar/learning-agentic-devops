name: Deterministic CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
  
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

  deploy-staging:
    needs: test # This ensures we don't deploy broken code
    if: github.ref == 'refs/heads/main' # Only deploy from the main branch
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging server..."
          echo "Using API Key: ${{ secrets.MOCK_API_KEY }}" 
          # In reality, you'd use this secret in a curl command or CLI tool

  # Job 3: Deploy to Production
  deploy-prod:
    needs: deploy-staging # Must pass staging first
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # This triggers the 'Required Reviewer' gate
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production server..."
          echo "Production deployment complete!"
